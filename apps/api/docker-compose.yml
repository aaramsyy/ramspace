services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ramspace
      POSTGRES_PASSWORD: ramspace
      POSTGRES_DB: ramspace_accounts
    ports:
      - "5432:5432"
    volumes:
      - ramspace-api-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ramspace -d ramspace_accounts"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ramspace-api-pg:
